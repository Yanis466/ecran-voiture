<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">
<title>Tableau de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0a0a0b; --fg:#f3f3f0; --mut:#8a8d94; --dim:#4a4d55; --line:#1d1f24; --off:#23262d; --red:#e5392f;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --txt:"Barlow",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--txt);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* Fond : deux nappes de couleur très douces, tirées de la pochette */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
#bg i{position:absolute;width:80vmax;height:80vmax;border-radius:50%;filter:blur(110px);opacity:.28;background-color:#2a3550;transition:background-color 2.4s ease;will-change:transform}
#bg .b1{left:-30vmax;top:-30vmax;animation:drift1 40s ease-in-out infinite alternate}
#bg .b2{right:-35vmax;bottom:-40vmax;animation:drift2 52s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(28vmax,22vmax)}}
@keyframes drift2{to{transform:translate(-30vmax,-18vmax)}}

#app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);grid-template-rows:auto 1fr;
  column-gap:clamp(20px,4vw,64px);padding:max(12px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));transition:transform .3s}
#app.hud{transform:scaleX(-1)}

.bar{grid-column:1/-1;display:flex;align-items:center;gap:16px;min-height:30px;color:var(--mut);font-size:14px;letter-spacing:.04em}
.bar #clock{font-family:var(--num);font-weight:600;font-size:20px;color:var(--fg);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.src{display:flex;align-items:center;gap:8px;margin-left:auto}
.src i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.src i.ok{background:#6fcf97}
#note{color:var(--fg);font-size:13px;line-height:1.3;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.src{cursor:pointer}

/* Compteur */
.speed{min-height:0;display:flex;align-items:center;justify-content:center}
.speed svg{width:100%;height:100%;max-height:100%}
#spd{font-family:var(--num);font-weight:600;font-size:158px;fill:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#spd.over{fill:var(--red)}
.unit{font-family:var(--txt);font-size:15px;letter-spacing:.32em;fill:var(--mut);font-weight:500}
.lab{font-family:var(--num);font-size:15px;font-weight:500;fill:var(--dim)}

/* Colonne droite */
.side{display:flex;flex-direction:column;justify-content:space-between;min-height:0;padding:6px 0 4px}
.limit{display:flex;align-items:center;gap:20px}
.sign{width:clamp(92px,27vh,150px);aspect-ratio:1;flex:none;border-radius:50%;background:#fff;border:clamp(9px,3.2vh,19px) solid var(--red);display:grid;place-items:center;color:#111;font-family:var(--num);font-weight:700;font-size:clamp(38px,12.5vh,76px);line-height:1;transition:background .3s,border-color .3s,color .3s}
.sign.three{font-size:clamp(30px,10vh,60px)}
.sign.none{background:transparent;border:2px dashed var(--dim);color:var(--dim);font-size:clamp(28px,8vh,44px)}
.road .k{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.road #road{font-size:clamp(17px,3.6vh,22px);font-weight:500;line-height:1.25}

.music{border-top:1px solid var(--line);padding-top:clamp(14px,3vh,26px);display:flex;flex-direction:column;gap:clamp(12px,2.6vh,20px)}
.mrow{display:flex;gap:clamp(14px,2.4vw,24px);align-items:center}
.cover{width:clamp(96px,24vh,150px);aspect-ratio:1;flex:none;border-radius:10px;background:#16181d center/cover;box-shadow:0 14px 34px #000a;display:grid;place-items:center;overflow:hidden}
.cover svg{width:34%;height:34%;stroke:var(--dim);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.meta{min-width:0;flex:1}
.now{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.title{font-family:var(--num);font-weight:600;font-size:clamp(24px,5.4vh,38px);line-height:1.05;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.artist{font-size:clamp(14px,2.8vh,18px);color:var(--mut);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline{display:flex;align-items:center;gap:12px;font-family:var(--num);font-size:15px;color:var(--mut);font-variant-numeric:tabular-nums}
.prog{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--fg);border-radius:2px}
.ctl{display:flex;align-items:center;justify-content:center;gap:clamp(18px,4vw,40px)}
.ctl button{width:54px;height:54px;display:grid;place-items:center;border-radius:50%;transition:transform .12s,background .12s}
.ctl button:active{transform:scale(.92)}
.ctl svg{width:26px;height:26px;fill:var(--fg)}
.ctl .main{width:68px;height:68px;background:var(--fg)}
.ctl .main svg{width:30px;height:30px;fill:#0a0a0b}

/* Accueil : connexion Spotify */
#welcome{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#welcome.on{display:flex}
.wbox{width:min(440px,100%);display:flex;flex-direction:column;gap:16px}
.wbox .k{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut)}
.wbox h1{font-family:var(--num);font-weight:600;font-size:clamp(40px,11vh,64px);line-height:1}
.wbox p{color:var(--mut);font-size:16px;line-height:1.5}
.wbtn{margin-top:6px;padding:16px 18px;border-radius:10px;font-size:17px;font-weight:600;background:var(--fg);color:#0a0a0b}
.wlink{padding:12px;color:var(--mut);font-size:15px}

@media (orientation:portrait){
  :root{--top:max(env(safe-area-inset-top),12px);--bot:max(env(safe-area-inset-bottom),16px)}
  html,body{overflow:hidden}
  #app{display:flex;flex-direction:column;height:100dvh;padding:var(--top) 22px var(--bot) 22px}
  .bar{flex:none;min-height:26px}
  #clock{display:none}
  .src{margin-left:0}
  .speed{flex:none;display:block;margin-top:4px}
  .speed svg{display:block;width:100%;height:auto}
  .side{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;padding:6px 0 0}
  .limit{gap:18px}
  .sign{width:84px;border-width:9px;font-size:38px}
  .sign.three{font-size:31px}
  .sign.none{font-size:30px}
  .road #road{font-size:21px}
  .music{flex:none;padding-top:14px;gap:14px;align-items:stretch}
  .mrow{flex-direction:column;align-items:center;gap:14px}
  .cover{width:var(--cv);height:var(--cv);aspect-ratio:auto;border-radius:14px}
  .meta{text-align:center;width:100%}
  .now{margin-bottom:6px}
  .title{font-size:34px;-webkit-line-clamp:1}
  .artist{font-size:18px;margin-top:4px}
  .ctl{gap:44px}
  .ctl button{width:58px;height:58px}
  .ctl .main{width:74px;height:74px}
  #app{--cv:clamp(88px,calc(100dvh - var(--top) - var(--bot) - 352px - 68vw),66vw)}
}
</style>
</head>
<body>
<div id="bg"><i class="b1"></i><i class="b2"></i></div>

<main id="app">
  <header class="bar">
    <span id="clock">--:--</span>
    <span class="src"><i id="dot"></i><span id="srcTxt">GPS</span></span>
    <span id="note"></span>
  </header>

  <section class="speed">
    <svg id="g" viewBox="0 0 500 330" aria-label="Compteur de vitesse">
      <g id="ticks"></g>
      <path id="mark" d="M-7 -6L7 -6L0 9Z" fill="#e5392f" opacity="0"/>
      <text id="spd" x="250" y="258" text-anchor="middle">0</text>
      <text class="unit" x="250" y="300" text-anchor="middle">KM/H</text>
    </svg>
  </section>

  <aside class="side">
    <div class="limit">
      <div class="sign none" id="sign"><span id="limVal">–</span></div>
      <div class="road"><span class="k">Limitation</span><span id="road">Recherche de la limite…</span></div>
    </div>
    <div class="music">
      <div class="mrow">
        <div class="cover" id="cover"></div>
        <div class="meta" id="meta"><div class="now" id="now">En lecture</div><div class="title" id="title"></div><div class="artist" id="artist"></div></div>
      </div>
      <div class="timeline"><span id="t1">0:00</span><div class="prog"><i id="prog"></i></div><span id="t2">0:00</span></div>
      <div class="ctl">
        <button id="prev" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
        <button id="play" class="main" aria-label="Lecture"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15l12-7.5z"/></svg></button>
        <button id="next" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
      </div>
    </div>
  </aside>
</main>

<div id="welcome"><div class="wbox">
  <span class="k">Spotify</span>
  <h1>Connecte ta musique</h1>
  <p>Le morceau en cours s'affiche sur l'écran et tu peux le piloter d'ici.</p>
  <button class="wbtn" id="wConnect">Connecter Spotify</button>
  <button class="wlink" id="wSkip">Continuer sans musique</button>
</div></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ================= Configuration ================= */
const CFG = {max:200, step:4, a0:150, sweep:240, cx:250, cy:205, rOut:190, rMinor:172, rMajor:160, rLabel:136,
             clientId:'fe2cea1d1ff44da196bbe490a63f8faa'};
const state = {mode:'demo', target:0, shown:0, limit:null, over:false};

/* ================= Stockage local ================= */
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

/* ================= Compteur ================= */
const ticks = [];
const svgEl = (name, attrs) => {const e = document.createElementNS('http://www.w3.org/2000/svg', name); for (const k in attrs) e.setAttribute(k, attrs[k]); return e};
const angleFor = v => CFG.a0 + CFG.sweep * v / CFG.max;
const polar = (deg, r) => {const t = deg * Math.PI / 180; return [CFG.cx + r * Math.cos(t), CFG.cy + r * Math.sin(t)]};

function buildGauge(){
  const host = $('ticks');
  const n = CFG.max / CFG.step;
  for (let i = 0; i <= n; i++){
    const v = i * CFG.step, a = angleFor(v), major = v % 20 === 0;
    const [x1,y1] = polar(a, major ? CFG.rMajor : CFG.rMinor), [x2,y2] = polar(a, CFG.rOut);
    const line = svgEl('line', {x1, y1, x2, y2, 'stroke-width': major ? 3 : 2, stroke: '#23262d'});
    host.appendChild(line);
    ticks.push({v, el: line, color: '#23262d'});
    if (major){
      const [lx, ly] = polar(a, CFG.rLabel);
      const t = svgEl('text', {x: lx, y: ly + 5, 'text-anchor': 'middle', class: 'lab'});
      t.textContent = v; host.appendChild(t);
    }
  }
}
function paintTicks(){
  const lim = state.limit;
  for (const t of ticks){
    let c = '#23262d';
    if (t.v <= state.shown + CFG.step / 2) c = (lim && t.v > lim) ? '#e5392f' : '#f3f3f0';
    if (c !== t.color){t.el.setAttribute('stroke', c); t.color = c}
  }
}
function frame(){
  state.shown += (state.target - state.shown) * 0.14;
  if (Math.abs(state.target - state.shown) < 0.05) state.shown = state.target;
  state.over = state.limit != null && state.shown > state.limit + 1;
  const n = $('spd'); n.textContent = Math.round(state.shown); n.classList.toggle('over', state.over);
  paintTicks();
  requestAnimationFrame(frame);
}

/* ================= Limitation de vitesse ================= */
const CH_DEFAULTS = {'CH:urban':50, 'CH:rural':80, 'CH:trunk':100, 'CH:motorway':120};
function parseMaxspeed(s){
  if (!s) return null;
  if (CH_DEFAULTS[s]) return CH_DEFAULTS[s];
  const m = String(s).match(/^(\d+)/); return m ? +m[1] : null;
}
function setLimit(value, roadName){
  state.limit = value;
  const sign = $('sign');
  $('limVal').textContent = value || '–';
  sign.classList.toggle('none', !value);
  sign.classList.toggle('three', !!value && value >= 100);
  $('road').textContent = roadName || (value ? 'Route' : 'Aucune limite trouvée');
  const mark = $('mark');
  if (value){
    const a = angleFor(value), [x, y] = polar(a, CFG.rOut + 12);
    mark.setAttribute('transform', 'translate(' + x + ' ' + y + ') rotate(' + (a + 90) + ')');
    mark.setAttribute('opacity', '1');
  } else mark.setAttribute('opacity', '0');
}
const R_EARTH = 6371000;
function distanceM(a, b){
  const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.sqrt(h));
}
const lim = {lastPos:null, lastTime:0, busy:false};
const OVERPASS = ['https://overpass.osm.ch/api/interpreter', 'https://overpass.openstreetmap.fr/api/interpreter'];
const OVERPASS_SLOW = 'https://overpass-api.de/api/interpreter';
const HW_DEFAULT = {motorway:120, motorway_link:80, living_street:20, residential:50};
function distToWayM(p, geom){
  const k = Math.PI / 180, cx = Math.cos(p.lat * k), best = {d:Infinity};
  const xy = g => [(g.lon - p.lon) * k * cx * R_EARTH, (g.lat - p.lat) * k * R_EARTH];
  for (let i = 0; i < geom.length - 1; i++){
    const [x1, y1] = xy(geom[i]), [x2, y2] = xy(geom[i + 1]);
    const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
    const t = l2 ? Math.max(0, Math.min(1, -(x1 * dx + y1 * dy) / l2)) : 0;
    best.d = Math.min(best.d, Math.hypot(x1 + t * dx, y1 + t * dy));
  }
  return best.d;
}
function fetchOverpass(url, query, ms){
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), ms);
  return fetch(url, {method:'POST', body:'data=' + encodeURIComponent(query), signal:ctl.signal})
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json() })
    .finally(() => clearTimeout(to));
}
async function overpass(query){
  /* Les deux serveurs rapides (suisse et français) partent en même temps ; le plus lent officiel sert de secours. */
  try{ return await Promise.any(OVERPASS.map(u => fetchOverpass(u, query, 8000))) }
  catch(e){ return await fetchOverpass(OVERPASS_SLOW, query, 20000) }
}
async function lookupLimit(lat, lon, acc){
  const now = Date.now(), here = {lat, lon};
  if (lim.busy) return;
  if (lim.lastPos && distanceM(here, lim.lastPos) < 30 && now - lim.lastTime < 25000) return;
  if (now - lim.lastTime < 4000) return;
  lim.busy = true; lim.lastPos = here; lim.lastTime = now;
  if (!state.limit) $('road').textContent = 'Recherche de la limite…';
  const r = Math.round(Math.min(60, Math.max(25, (acc || 0) * 1.2)));
  const query = '[out:json][timeout:8];way(around:' + r + ',' + lat + ',' + lon + ')["highway"]["highway"!~"footway|path|cycleway|steps|pedestrian|track|bridleway|corridor|proposed|construction|platform|service"];out tags geom 12;';
  try{
    const data = await overpass(query);
    const ways = (data.elements || []).filter(w => w.geometry && w.geometry.length > 1)
      .map(w => ({w, d: distToWayM(here, w.geometry)})).sort((a, b) => a.d - b.d);
    const best = ways[0];
    if (!best){ setLimit(null); }
    else {
      const t = best.w.tags;
      let v = parseMaxspeed(t.maxspeed);
      if (!v && ways[1] && ways[1].d - best.d < 4 && t.name && ways[1].w.tags.name === t.name) v = parseMaxspeed(ways[1].w.tags.maxspeed);
      if (!v) v = HW_DEFAULT[t.highway] || null;
      setLimit(v, t.name || t.ref);
    }
  }catch(e){ if (!state.limit) $('road').textContent = 'Limite indisponible' }
  finally{ lim.busy = false }
}

/* ================= Source : GPS réel ================= */
let watchId = null, wakeLock = null, lastFix = null, gpsWatchdog = null, gpsRetry = null, speedEma = 0;
function notify(text, ms){ const n = $('note'); n.textContent = text; clearTimeout(notify.t); notify.t = setTimeout(() => { n.textContent = '' }, ms || 7000) }
function setSource(text, ok){ $('srcTxt').textContent = text; $('dot').className = ok ? 'ok' : '' }
async function keepAwake(){ try{ wakeLock = await navigator.wakeLock.request('screen') }catch(e){} }
function speedFromFix(fix){
  const c = fix.coords;
  if (c.speed != null && c.speed >= 0) return c.speed * 3.6;
  if (lastFix){
    const dt = (fix.timestamp - lastFix.timestamp) / 1000;
    if (dt >= 0.5 && dt < 10){
      const d = distanceM({lat:lastFix.coords.latitude, lon:lastFix.coords.longitude}, {lat:c.latitude, lon:c.longitude});
      if (d < Math.max(5, c.accuracy * 0.6)) return 0;
      return d / dt * 3.6;
    }
  }
  return null;
}
function onFix(fix){
  clearTimeout(gpsRetry);
  const acc = Math.round(fix.coords.accuracy);
  const weak = acc > 100;
  setSource((weak ? 'GPS faible' : 'GPS actif') + ' · ±' + acc + ' m', !weak);
  if (!weak) $('note').textContent = '';
  const v = speedFromFix(fix);
  if (v == null){ lastFix = fix; lastFix.rcv = Date.now(); lookupLimit(fix.coords.latitude, fix.coords.longitude, fix.coords.accuracy); return }
  speedEma = v < 3 ? 0 : (speedEma ? speedEma * 0.35 + v * 0.65 : v);
  state.target = speedEma;
  lastFix = fix; lastFix.rcv = Date.now();
  lookupLimit(fix.coords.latitude, fix.coords.longitude, fix.coords.accuracy);
}
function restartGps(){ if (state.mode === 'live') startLive(true) }
function onFixError(e){
  const causes = {1:'Localisation refusée', 2:'Position indisponible', 3:'Recherche GPS…'};
  setSource(causes[e.code] || 'GPS indisponible', false);
  if (e.code === 1){
    notify('Autorise la localisation : Réglages iPhone > Confidentialité et sécurité > Service de localisation > ton navigateur > Lors de l’utilisation. Puis touche l’état GPS en haut.', 20000);
    try{ navigator.permissions.query({name:'geolocation'}).then(p => { p.onchange = () => { if (p.state !== 'denied') restartGps() } }) }catch(_){}
  } else {
    notify('Signal GPS faible : place l’iPhone près du pare-brise. Nouvelle tentative automatique…', 8000);
    clearTimeout(gpsRetry); gpsRetry = setTimeout(restartGps, 3000);
  }
}
function startLive(quiet){
  stopSources();
  state.mode = 'live'; if (!quiet){ setLimit(null); state.target = 0; speedEma = 0; lastFix = null }
  renderTrack();
  if (!navigator.geolocation){ setSource('GPS indisponible', false); notify('Ce navigateur n’a pas de GPS. Ouvre la page dans Safari.', 15000); return }
  setSource('GPS : recherche…', false); keepAwake();
  watchId = navigator.geolocation.watchPosition(onFix, onFixError, {enableHighAccuracy:true, maximumAge:0, timeout:20000});
  clearInterval(gpsWatchdog);
  gpsWatchdog = setInterval(() => {
    if (state.mode !== 'live' || !lastFix) return;
    if (Date.now() - lastFix.rcv > 10000){ setSource('Signal GPS perdu', false); state.target = 0; speedEma = 0; restartGps() }
  }, 5000);
  if (store.get('sp_token')) startSpotifyPolling();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.mode === 'live'){ keepAwake(); restartGps() } });

/* ================= Source : démo ================= */
const DEMO_PHASES = [
  {limit:50,  speed:46,  secs:14, road:'Rue de la Gare'},
  {limit:80,  speed:79,  secs:16, road:'Route cantonale'},
  {limit:120, speed:116, secs:18, road:'A5'},
  {limit:80,  speed:92,  secs:9,  road:'Route cantonale'},
  {limit:50,  speed:34,  secs:12, road:'Peseux'}
];
const DEMO_TRACKS = [
  {title:'Nuit sur l’autoroute', artist:'Artiste démo', hue:215, secs:200},
  {title:'Lumières du Val-de-Ruz',  artist:'Groupe fictif', hue:150, secs:185},
  {title:'Neuchâtel 2 h du mat',    artist:'Artiste démo', hue:330, secs:220},
  {title:'Dernier virage',          artist:'Groupe fictif', hue:30,  secs:170}
];
let demoTimer = null, demoIndex = 0;
function demoSelect(i){
  demoIndex = (i + DEMO_TRACKS.length) % DEMO_TRACKS.length;
  const t = DEMO_TRACKS[demoIndex];
  music.track = {title:t.title, artist:t.artist, hue:t.hue}; music.dur = t.secs; music.pos = 0; renderTrack();
}
function startDemo(){
  stopSources();
  state.mode = 'demo'; music.live = false; music.playing = true; demoSelect(0);
  setSource('Démo', false);
  let phase = 0, elapsed = 0, last = performance.now();
  setLimit(DEMO_PHASES[0].limit, DEMO_PHASES[0].road);
  demoTimer = setInterval(() => {
    const now = performance.now(), dt = (now - last) / 1000; last = now; elapsed += dt;
    if (elapsed > DEMO_PHASES[phase].secs){ elapsed = 0; phase = (phase + 1) % DEMO_PHASES.length; setLimit(DEMO_PHASES[phase].limit, DEMO_PHASES[phase].road) }
    state.target = Math.max(0, DEMO_PHASES[phase].speed + Math.sin(now / 700) * 2);
  }, 100);
}
function stopSources(){
  clearInterval(demoTimer); demoTimer = null;
  if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null;
  clearInterval(pollTimer); pollTimer = null; clearInterval(gpsWatchdog); clearTimeout(gpsRetry);
}

/* ================= Musique : état et affichage ================= */
const music = {track:null, playing:false, pos:0, dur:1, live:false};
const fmtTime = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') };
const ICON_PLAY = '<path d="M7 4.5v15l12-7.5z"/>', ICON_PAUSE = '<path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/>';
function clearTrack(){ music.track = null; music.playing = false; music.pos = 0 }
const NOTE_ICON = '<svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>';
function renderTrack(){
  const t = music.track, cover = $('cover'), connected = !!store.get('sp_token');
  $('playIcon').innerHTML = music.playing ? ICON_PAUSE : ICON_PLAY;
  if (!t){
    cover.style.background = ''; cover.innerHTML = NOTE_ICON;
    $('now').textContent = connected ? 'Spotify' : 'Spotify non connecté';
    $('title').textContent = connected ? 'Rien en lecture' : 'Touche pour te connecter';
    $('artist').textContent = connected ? 'Lance un morceau dans Spotify' : '';
  } else {
    cover.innerHTML = '';
    cover.style.background = t.img ? 'center/cover url(' + t.img + ')' : 'linear-gradient(135deg,hsl(' + t.hue + ' 45% 42%),hsl(' + ((t.hue + 50) % 360) + ' 45% 22%))';
    $('now').textContent = music.playing ? 'En lecture' : 'En pause';
    $('title').textContent = t.title; $('artist').textContent = t.artist;
  }
  refreshBackground();
}
setInterval(() => {
  if (music.track && music.playing){
    music.pos = Math.min(music.dur, music.pos + 0.25);
    if (!music.live && music.pos >= music.dur) demoSelect(demoIndex + 1);
  }
  $('prog').style.width = (music.track ? 100 * music.pos / music.dur : 0) + '%';
  $('t1').textContent = fmtTime(music.track ? music.pos : 0); $('t2').textContent = music.track ? '-' + fmtTime(music.dur - music.pos) : '0:00';
}, 250);

/* ================= Fond selon la pochette ================= */
const bg = {key:'', blobs:Array.from(document.querySelectorAll('#bg i'))};
function hashHue(str){ let x = 0; for (const c of str) x = (x * 31 + c.charCodeAt(0)) % 360; return x }
function paletteFromHue(h){ return ['hsl(' + h + ' 55% 38%)', 'hsl(' + ((h + 45) % 360) + ' 50% 30%)'] }
function applyPalette(cols){ bg.blobs.forEach((b, i) => { b.style.backgroundColor = cols[i % cols.length] }) }
function paletteFromPixels(d){
  const buckets = {};
  for (let i = 0; i < d.length; i += 4){
    const r = d[i], g = d[i+1], b = d[i+2], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    const sat = mx ? (mx - mn) / mx : 0, val = mx / 255;
    if (val < .2) continue;
    const key = (r >> 5) + ',' + (g >> 5) + ',' + (b >> 5), w = sat * sat + .05, o = buckets[key] || (buckets[key] = {w:0, r:0, g:0, b:0});
    o.w += w; o.r += r * w; o.g += g * w; o.b += b * w;
  }
  const list = Object.values(buckets).sort((a, b) => b.w - a.w).map(o => [Math.round(o.r / o.w), Math.round(o.g / o.w), Math.round(o.b / o.w)]);
  const far = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]) > 70, out = [];
  for (const c of list){ if (out.every(o => far(o, c))) out.push(c); if (out.length === 2) break }
  while (out.length && out.length < 2) out.push(out[0]);
  return out.map(c => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')');
}
function paletteFromImage(url){
  return new Promise((resolve, reject) => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => { try{
      const c = document.createElement('canvas'); c.width = c.height = 32;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0, 32, 32);
      const p = paletteFromPixels(x.getImageData(0, 0, 32, 32).data); p.length ? resolve(p) : reject(new Error('vide'));
    }catch(e){ reject(e) } };
    im.onerror = () => reject(new Error('image')); im.src = url;
  });
}
async function refreshBackground(){
  const t = music.track, key = t ? t.title + '|' + t.artist + '|' + (t.img || '') : 'none';
  if (key === bg.key) return; bg.key = key;
  if (!t){ applyPalette(['#2a3550', '#1d2433']); return }
  if (t.img){ try{ const p = await paletteFromImage(t.img); if (bg.key === key) applyPalette(p); return }catch(e){} }
  applyPalette(paletteFromHue(t.hue != null ? t.hue : hashHue(t.title + t.artist)));
}

/* ================= Spotify (PKCE) ================= */
const REDIRECT = location.origin + location.pathname;
const rand = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/[^a-zA-Z0-9]/g, '').slice(0, n) };
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function spotifyLogin(){
  const id = store.get('sp_cid') || CFG.clientId;
  store.set('sp_cid', id);
  const verifier = rand(64); store.set('sp_v', verifier);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id:id, response_type:'code', redirect_uri:REDIRECT, scope:'user-read-playback-state user-modify-playback-state',
    code_challenge_method:'S256', code_challenge:challenge});
}
async function requestToken(body){
  const res = await fetch('https://accounts.spotify.com/api/token', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(body)});
  const j = await res.json();
  if (!j.access_token) throw new Error(j.error_description || 'jeton refusé');
  store.set('sp_token', j.access_token); if (j.refresh_token) store.set('sp_refresh', j.refresh_token);
  store.set('sp_exp', Date.now() + j.expires_in * 1000 - 60000);
}
async function accessToken(){
  if (Date.now() > +store.get('sp_exp') && store.get('sp_refresh'))
    await requestToken({grant_type:'refresh_token', refresh_token:store.get('sp_refresh'), client_id:store.get('sp_cid')});
  return store.get('sp_token');
}
async function rawPlayer(path, method, body){
  const token = await accessToken(); if (!token) return null;
  const opt = {method:method || 'GET', headers:{Authorization:'Bearer ' + token}};
  if (body){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body) }
  return fetch('https://api.spotify.com/v1/me/player' + path, opt);
}
/* Erreur 404 = aucun appareil Spotify actif : on réveille celui de l'iPhone puis on relance la commande. */
async function wakeDevice(){
  const r = await rawPlayer('/devices'); if (!r || !r.ok) return false;
  const list = (await r.json()).devices || [];
  if (!list.length){
    notify('Aucun appareil Spotify trouvé. Ouvre l\u2019app Spotify sur ton iPhone, lance un morceau 2 secondes, puis reviens ici.', 15000);
    return false;
  }
  const d = list.find(x => x.is_active) || list.find(x => x.type === 'Smartphone') || list[0];
  const t = await rawPlayer('', 'PUT', {device_ids:[d.id], play:true});
  return !!t && t.ok;
}
async function playerCall(path, method, body){
  const res = await rawPlayer(path, method, body); if (!res) return null;
  if (res.status === 204 || res.status === 202) return {};
  if (res.status === 404 && method && method !== 'GET'){
    if (!(await wakeDevice())) return null;
    if (path === '/pause') return {};
    await new Promise(r => setTimeout(r, 900));
    const again = await rawPlayer(path, method, body);
    return again && again.ok ? {} : null;
  }
  if (!res.ok){ notify('Spotify : erreur ' + res.status + (res.status === 403 ? ' (Premium requis pour les commandes)' : '')); return null }
  return method && method !== 'GET' ? {} : res.json();
}
let pollTimer = null;
async function pollSpotify(){
  try{
    const j = await playerCall('');
    if (!j || !j.item){ clearTrack(); renderTrack(); return }
    const img = (j.item.album.images[1] || j.item.album.images[0] || {}).url;
    music.track = {title:j.item.name, artist:j.item.artists.map(a => a.name).join(', '), img};
    music.playing = j.is_playing; music.pos = j.progress_ms / 1000; music.dur = j.item.duration_ms / 1000; renderTrack();
  }catch(e){ notify('Spotify : ' + e.message)}
}
function startSpotifyPolling(){ clearInterval(pollTimer); music.live = true; pollSpotify(); pollTimer = setInterval(pollSpotify, 3000) }
async function finishSpotifyLogin(){
  const code = new URLSearchParams(location.search).get('code');
  if (!code || !store.get('sp_v')) return false;
  try{
    await requestToken({grant_type:'authorization_code', code, redirect_uri:REDIRECT, client_id:store.get('sp_cid'), code_verifier:store.get('sp_v')});
    history.replaceState(null, '', location.pathname); return true;
  }catch(e){ notify('Connexion Spotify : ' + e.message); showWelcome(); return false }
}
function spotifyLogout(){
  ['sp_token','sp_refresh','sp_exp','sp_v'].forEach(k => store.del(k));
  clearInterval(pollTimer); music.live = false; clearTrack(); renderTrack(); notify('Spotify déconnecté.');
}
async function togglePlay(){
  if (!music.live){ music.playing = !music.playing; renderTrack(); return }
  await playerCall(music.playing ? '/pause' : '/play', 'PUT'); pollSpotify();
}
async function skip(dir){
  if (!music.live){ demoSelect(demoIndex + dir); return }
  await playerCall(dir > 0 ? '/next' : '/previous', 'POST'); setTimeout(pollSpotify, 600);
}

/* ================= Interface ================= */
function showWelcome(){ $('welcome').classList.add('on') }
function hideWelcome(){ $('welcome').classList.remove('on') }
function toggleHud(){ $('app').classList.toggle('hud') }
function tickClock(){ $('clock').textContent = new Date().toLocaleTimeString('fr-CH', {hour:'2-digit', minute:'2-digit'}) }
function skipSpotify(){ try{ sessionStorage.setItem('sp_skip', '1') }catch(e){} hideWelcome(); startLive() }
function hasSkipped(){ try{ return sessionStorage.getItem('sp_skip') === '1' }catch(e){ return false } }
function bindUi(){
  $('srcTxt').parentElement.onclick = () => { if (state.mode === 'live'){ startLive() } };
  $('wConnect').onclick = spotifyLogin; $('wSkip').onclick = skipSpotify;
  $('meta').onclick = $('cover').onclick = () => { if (!store.get('sp_token')) spotifyLogin() };
  $('play').onclick = togglePlay; $('next').onclick = () => skip(1); $('prev').onclick = () => skip(-1);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.mode === 'live') keepAwake() });
}

/* ================= Démarrage =================
   Adresse + #demo : trajet simulé (pour tester sans rouler)
   Adresse + #hud  : affichage miroir pour pare-brise
   Adresse + #reset : déconnecte Spotify et réaffiche l'écran de connexion */
async function boot(){
  buildGauge(); bindUi(); tickClock(); setInterval(tickClock, 1000);
  requestAnimationFrame(frame);
  if (location.hash.indexOf('reset') >= 0){
    ['sp_token','sp_refresh','sp_exp','sp_v'].forEach(k => store.del(k));
    try{ sessionStorage.removeItem('sp_skip') }catch(e){}
    history.replaceState(null, '', location.pathname);
  }
  if (location.hash.indexOf('hud') >= 0) toggleHud();
  if (location.hash.indexOf('demo') >= 0){ startDemo(); return }
  const justLoggedIn = await finishSpotifyLogin();
  if (justLoggedIn){ startLive(); notify('Spotify connecté'); return }
  if (store.get('sp_token') || hasSkipped()){ startLive(); return }
  renderTrack(); showWelcome();
}
boot();
})();
